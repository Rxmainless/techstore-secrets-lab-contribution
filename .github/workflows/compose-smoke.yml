name: compose-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxe do Compose
        run: docker compose config --quiet

      - name: Subir os serviços
        run: docker compose up -d

      - name: Aguardar a aplicação
        run: |
          for i in $(seq 1 40); do
            if curl -sf localhost:3000/health > /dev/null; then
              echo "aplicação respondeu após $((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "aplicação não respondeu em 120s"
          exit 1

      - name: Testar endpoints
        run: |
          echo "== /";       curl -sf localhost:3000/;       echo
          echo "== /health"; curl -sf localhost:3000/health; echo

      - name: Verificar exposições (regressão de segurança)
        run: |
          falhou=0

          health=$(curl -sf localhost:3000/health)
          if echo "$health" | grep -qiE "database|localhost"; then
            echo "::error::/health expõe detalhes de infraestrutura"
            falhou=1
          fi

          status=$(curl -s -o /dev/null -w "%{http_code}" localhost:3000/config-check)
          echo "/config-check sem token respondeu $status"
          if [ "$status" = "200" ]; then
            echo "::error::/config-check acessível sem autenticação"
            falhou=1
          fi

          if curl -sI localhost:3000/ | grep -qi "^x-powered-by"; then
            echo "::error::cabeçalho X-Powered-By exposto"
            falhou=1
          fi

          if docker compose logs app --no-color | grep -qiE "como (root|techstore)|password"; then
            echo "::error::logs da aplicação expõem usuário ou credenciais"
            falhou=1
          fi

          if [ "$falhou" -eq 0 ]; then
            echo "nenhuma exposição encontrada"
          fi
          exit "$falhou"

      - name: Status dos containers
        if: always()
        run: docker compose ps

      - name: Logs dos containers
        if: always()
        run: docker compose logs --no-color

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v